[project]
name = "mailerup-mcp"
version = "1.0.0"
description = "Servidor MCP para administrar MailerUp (newsletter self-hosted) desde Claude u otros modelos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maalfer" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
mailerup-mcp = "mailerup_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mailerup_mcp"]
